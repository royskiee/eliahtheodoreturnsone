     THE BOOK
     ========================================================= -->
<div class="book-stage">

    <!-- Mobile page-sweep overlay — covers only the book area during flips -->
    <div class="page-sweep" id="pageSweep" aria-hidden="true"></div>

    <!-- Static base pages — what's revealed beneath the flipping leaves -->
    <div class="pages">

      <!-- LEFT PAGE (always shows the current spread's left content) -->
      <div class="base-page left" id="basePageLeft">
        <!-- Content injected by JS -->
      </div>

      <!-- SPINE -->
      <div class="spine" aria-hidden="true"></div>

      <!-- RIGHT PAGE (always shows the current spread's right content) -->
      <div class="base-page right" id="basePageRight">
        <!-- Content injected by JS -->
      </div>
    </div>

    <!-- Page leaves — flipping paper layer -->
    <div class="leaves" aria-hidden="false">

      <div class="left-zone"></div>
      <div class="spine-spacer"></div>
      <div class="right-zone">
        <!-- Cover leaf sits in the right-zone since it's a forward-flip leaf -->
        <div class="leaf cover-leaf" id="coverLeaf">
          <div class="face front" id="coverFront"></div>
          <div class="face back" id="coverBack"></div>
        </div>
        <!-- Other forward-flip leaves are injected here by JS -->
      </div>

    </div>

    <!-- Click zones for edge flips -->
    <div class="edge-zone left" id="edgeLeft" aria-label="Previous page"></div>
    <div class="edge-zone right" id="edgeRight" aria-label="Next page"></div>

  </div>
</div>
